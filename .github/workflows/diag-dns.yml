name: diag-dns

# DIAGNOSTIC ONLY (owner-approved, run #45 investigation): measures DNS lookups in a VM on a real
# runner (guest has an IPv6 route, runner has no IPv6 egress) for the released image and for the
# candidate fixes. No build, no signing, no promotion, no secrets, no environment.

on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

concurrency:
  group: diag-dns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: DNS measurement (IPv6 route without egress)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install tooling and enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo modprobe vhost_vsock && sudo chmod 0666 /dev/vhost-vsock
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf

      - name: Runner network facts
        run: |
          ip -6 route || true
          curl -6 -s -m 5 -o /dev/null -w 'IPv6 egress: http %{http_code}\n' https://dns.quad9.net/ || echo "IPv6 egress: none"
          curl -4 -s -m 5 -o /dev/null -w 'IPv4 egress: http %{http_code}\n' https://dns.quad9.net/

      - name: Test disk from the released image (:stable, public; no signing needed for a diagnostic)
        run: |
          mkdir -p tests/out
          ssh-keygen -q -t ed25519 -N '' -f tests/out/ci_key
          sudo podman pull ghcr.io/elstvictor05-droid/kiezel:stable
          sudo podman image inspect --format 'revision={{index .Labels "org.opencontainers.image.revision"}} created={{.Created}}' ghcr.io/elstvictor05-droid/kiezel:stable
          sudo tests/boot/make-test-disk.sh ghcr.io/elstvictor05-droid/kiezel:stable tests/out/ci_key.pub tests/out/disk
          sudo chown -R "$(id -u):$(id -g)" tests/out

      - name: Measure (baseline, A, B with IPv6 route; baseline control without)
        timeout-minutes: 55
        run: tests/diag/dns-ipv6.sh --disk tests/out/disk/disk.qcow2 --key tests/out/ci_key --workdir tests/out/diag

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diag-dns
          path: tests/out/diag/
          if-no-files-found: ignore
