name: build

# Builds the Kiezel image, runs static and boot tests, and (on main) hands the tested digest
# to the protected `release` environment for signing. The `build + boot test` job is a
# REQUIRED status check on main, so Renovate can only auto-merge what passes it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"      # weekly rebuild: picks up Fedora/Universal Blue fixes
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/elstvictor05-droid/kiezel
  LOCAL: localhost/kiezel:ci

jobs:
  build:
    name: build + boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write        # push UNSIGNED candidates on main only; devices reject them until signed
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install test tooling and enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          # SSH to test VMs goes over virtio-vsock, so the Kiezel firewall stays fully enabled.
          sudo modprobe vhost_vsock && sudo chmod 0666 /dev/vhost-vsock
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf swtpm skopeo

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4   # pinned (ADR-0003); Renovate bumps it, the signature-path tests must then prove the format

      - name: Verify Universal Blue signature on the pinned base image
        run: |
          base="$(awk '/^FROM ghcr.io\/ublue-os\//{print $2; exit}' Containerfile)"
          echo "base: ${base}"
          cosign verify --key tests/keys/ublue-os.pub "${base}" > /dev/null
          echo "Base image signature OK"

      - name: Build image
        run: |
          sudo podman build --pull=newer -t "${LOCAL}" \
            --build-arg KIEZEL_VERSION="$(date -u +%Y%m%d).${GITHUB_SHA::7}" .

      - name: Static image checks
        run: sudo podman run --rm -v ./tests/image:/t:ro,z "${LOCAL}" /t/check-image.sh

      - name: Kickstart must keep signature verification
        run: tests/iso/check-kickstart.sh iso/kiezel.ks

      - name: Build test disk (qcow2)
        run: |
          mkdir -p tests/out
          ssh-keygen -q -t ed25519 -N '' -f tests/out/ci_key
          sudo tests/boot/make-test-disk.sh "${LOCAL}" tests/out/ci_key.pub tests/out/disk
          sudo chown -R "$(id -u):$(id -g)" tests/out

      - name: Serve good, good2 and deliberately broken images from a local registry
        run: |
          # One name for the test registry that resolves on the runner AND (as 10.0.2.2) in the VM,
          # so signatures made here carry the same image identity the VM verifies.
          echo '127.0.0.1 kiezel-registry.test' | sudo tee -a /etc/hosts
          # A "local" name the VM must resolve through the router's DNS (QEMU forwards to the host).
          echo '10.0.2.2 nas.home.arpa' | sudo tee -a /etc/hosts
          sudo podman run -d --name registry -p 5000:5000 \
            docker.io/library/registry:3@sha256:52b489ad8e6f40d1a676702e3ce398ec796ce38f08fbb786e1f324baa12d84b8
          sudo podman tag "${LOCAL}" localhost:5000/kiezel:good
          printf 'FROM %s\nLABEL kiezel.ci="good2"\n' "${LOCAL}" | sudo podman build -t localhost:5000/kiezel:good2 -f - .
          sudo podman build -f tests/boot/Containerfile.broken --build-arg BASE="${LOCAL}" -t localhost:5000/kiezel:broken .
          for t in good good2 broken; do sudo podman push --tls-verify=false "localhost:5000/kiezel:${t}"; done

      - name: Signature path fixtures (format in registry + device-style verify; never skipped)
        run: |
          sudo env "PATH=${PATH}" tests/sign/sigtest-setup.sh kiezel-registry.test:5000 tests/out/sigtest "${LOCAL}"
          sudo chown -R "$(id -u):$(id -g)" tests/out/sigtest

      - name: Fetch Lynis (pinned)
        run: |
          curl -fsSL -o tests/out/lynis.tar.gz https://downloads.cisofy.com/lynis/lynis-3.1.7.tar.gz
          echo "b5314a07fd85fa3ffc7da57b508f0108ec3280d84e4af823f805d95cbbc2428c  tests/out/lynis.tar.gz" | sha256sum -c -

      - name: Boot test (Secure Boot, TPM2, AVC, greenboot, hardening, signature path, update, rollback)
        run: |
          tests/boot/boot-test.sh --disk tests/out/disk/disk.qcow2 --key tests/out/ci_key \
            --registry 127.0.0.1:5000 --sigtest tests/out/sigtest --lynis tests/out/lynis.tar.gz --workdir tests/out/boot \
            ${{ github.event.pull_request.head.repo.fork == true && '--allow-skip' || '' }}

      - name: Upload boot test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test-report
          path: |
            tests/out/boot/report.txt
            tests/out/boot/serial-*.log
            tests/out/boot/avc*.txt
            tests/out/boot/lynis*
          if-no-files-found: ignore

      - name: Push unsigned candidate (main only)
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="candidate-${GITHUB_SHA::7}"
          sudo podman push --digestfile /tmp/digest "${LOCAL}" "${IMAGE}:${tag}"
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          # A bootable image that is NEVER signed: the installer test must refuse it (ADR-0005).
          printf 'FROM %s\nLABEL kiezel.ci="unsigned-bootable"\n' "${LOCAL}" | sudo podman build -t "${IMAGE}:ci-unsigned-bootable" -f - .
          sudo podman push "${IMAGE}:ci-unsigned-bootable"

  release:
    name: sign + promote
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release       # protected: owner approval required, main only, holds the key
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4   # pinned (ADR-0003); Renovate bumps it, the signature-path tests must then prove the format

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sign the tested digest (classic format, via the shared signing script)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test -n "${DIGEST}"
          ci/sign.sh env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Classic signature tag is in the registry
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: tests/sign/check-format.sh ghcr.io "${IMAGE#ghcr.io/}" "${DIGEST}"

      - name: Device-style verification (skopeo + Kiezel policy) BEFORE promotion
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # This is what decides promotion. "cosign verify" is not proof that devices accept the
          # image (ADR-0003, incident build #11).
          common=(--policy system_files/etc/containers/policy.json \
                  --registries-d system_files/etc/containers/registries.d \
                  --keys system_files/usr/share/pki/containers)
          tests/sign/device-verify.sh --expect accept --image "${IMAGE}@${DIGEST}" "${common[@]}"
          tests/sign/device-verify.sh --expect reject --image "${IMAGE}:ci-unsigned-bootable" "${common[@]}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > /dev/null   # secondary check only

      - name: Promote by digest to stable and dated tags
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          for tag in stable "$(date -u +%Y%m%d)"; do
            skopeo copy --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${tag}"
            got="$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE}:${tag}")"
            if [[ "${got}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${got}, expected the verified ${DIGEST}"; exit 1
            fi
            echo "${IMAGE}:${tag} -> ${DIGEST} (verified)"
          done
