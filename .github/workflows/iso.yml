name: iso

# Installer tests (ADR-0005). Heavy (a full network install per case), so not on every PR:
# weekly, on demand, and whenever the installer itself changes.
#   install-signed    the CI-test ISO installs the signed :stable image to an encrypted disk
#   refuse-unsigned   the same ISO pointed at an UNSIGNED bootable image must refuse to install

on:
  workflow_call:          # used by release.yml: a tagged release cannot publish without these tests
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:
  pull_request:
    paths: ["iso/**", "tests/iso/**", ".github/workflows/iso.yml", "system_files/usr/share/pki/containers/**"]
  push:
    branches: [main]
    paths: ["iso/**", "tests/iso/**", ".github/workflows/iso.yml", "system_files/usr/share/pki/containers/**"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/elstvictor05-droid/kiezel

jobs:
  install-test:
    name: install test (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: install-signed
            tag: stable
            expect: success
          - case: refuse-unsigned
            tag: ci-unsigned-bootable
            expect: signature-rejected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tooling and enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          # SSH to test VMs goes over virtio-vsock, so the Kiezel firewall stays fully enabled.
          sudo modprobe vhost_vsock && sudo chmod 0666 /dev/vhost-vsock
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf swtpm gpgv

      - name: Record which commit ${{ matrix.tag }} was built from
        if: matrix.expect == 'success'
        run: |
          # iso.yml installs the RELEASED image, not this branch, so the expected commit is the one
          # :stable carries now; post-install-check.sh fails if the installed system differs or has
          # no commit at all (images from before ci/build-commit.sh).
          rev="$(skopeo inspect --no-tags --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://${IMAGE}:${{ matrix.tag }}")"
          echo "${{ matrix.tag }} revision: ${rev:-<none>}"
          echo "EXPECT_COMMIT=${rev}" >> "$GITHUB_ENV"

      - name: Build CI-test ISO for ${{ matrix.tag }}
        run: |
          mkdir -p tests/out
          ssh-keygen -q -t ed25519 -N '' -f tests/out/ci_key
          iso/build-iso.sh --test --test-pubkey tests/out/ci_key.pub \
            --image "${IMAGE}:${{ matrix.tag }}" tests/out/iso

      - name: Install test (expect ${{ matrix.expect }})
        run: |
          TIMEOUT=4200 tests/iso/install-test.sh --iso tests/out/iso/kiezel-netinstall-ci-test.iso \
            --expect "${{ matrix.expect }}" --workdir tests/out/install

      - name: Boot the installed system and check it (LUKS2, Secure Boot, graphical login, trust policy)
        if: matrix.expect == 'success'
        run: tests/iso/post-install-check.sh --workdir tests/out/install --key tests/out/ci_key

      - name: Upload installer serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.case }}
          path: |
            tests/out/install/serial.log
            tests/out/install/serial-boot.log
            tests/out/install/post-install-report.txt
            tests/out/iso/kiezel.ks
          if-no-files-found: ignore

  flathub-eol:
    # Weekly too: an app can go end-of-life on Flathub without any change in this repository
    # (org.mozilla.Thunderbird did). Exit 3 = Flathub unreachable, never reported as end-of-life.
    name: curated apps not end-of-life on Flathub
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flatpak and add Flathub (user installation, GPG-verified repo file)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q flatpak python3-yaml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check every app in config.yaml
        run: FLATPAK_INSTALLATION=--user tests/image/check-flathub-eol.sh config.yaml

  production-iso:
    # Built on PRs too: the production path (no --test) must never go untested again.
    name: production ISO (unsigned artifact; signed at release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gpgv
          iso/build-iso.sh tests/out/iso
          ! grep -q 'CI TEST KICKSTART' tests/out/iso/kiezel.ks   # never ship the test kickstart
          grep -qx 'graphical' tests/out/iso/kiezel.ks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiezel-netinstall
          path: |
            tests/out/iso/kiezel-netinstall.iso
            tests/out/iso/kiezel-netinstall.iso.sha256
          retention-days: 14
