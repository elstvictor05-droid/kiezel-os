# Kiezel kernel hardening (docs/hardening.md has what / why / risk for every line).
# Only settings that do not break Flatpak, Firefox or old GPUs. Deliberately NOT here:
# user-namespace restrictions (Flatpak and the Firefox sandbox need them), io_uring limits.
# Already enforced by Fedora's kernel config: dmesg_restrict, unprivileged BPF off,
# init_on_alloc, kernel stack offset randomisation.

# Hide kernel addresses from everyone (helps against kernel exploit development).
kernel.kptr_restrict = 2
# Only parent processes may be traced (blocks one process spying on another of the same user).
kernel.yama.ptrace_scope = 1
# No loading a new kernel at runtime (Secure Boot lockdown already restricts this).
kernel.kexec_load_disabled = 1
# Unprivileged BPF stays off and cannot be switched back on without a reboot.
kernel.unprivileged_bpf_disabled = 1
# Harden the BPF JIT against spraying attacks.
net.core.bpf_jit_harden = 2
# Do not auto-load TTY line disciplines (a recurring local root vector).
dev.tty.ldisc_autoload = 0
# No core dumps of setuid programs (they can contain secrets).
fs.suid_dumpable = 0
# Stricter protection for FIFOs and regular files in world-writable sticky directories.
fs.protected_fifos = 2
fs.protected_regular = 2
# More randomness in memory layout (ASLR).
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Network: a desktop is not a router; ignore ICMP redirects (MITM on hostile Wi-Fi).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
