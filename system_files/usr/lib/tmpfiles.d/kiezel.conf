# Kiezel machine-local state. /var belongs to the machine, so it is created at boot, not shipped.
d /var/lib/kiezel          0755 root root -
d /var/lib/kiezel/notices  0755 root root -
# Firefox (Flatpak) reads its enterprise policies from the systemconfig extension; the policies
# themselves ship in /usr with the image (ADR-0011).
d /var/lib/flatpak/extension                                               0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig              0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64       0755 root root -
L+ /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /usr/share/kiezel/firefox-systemconfig
