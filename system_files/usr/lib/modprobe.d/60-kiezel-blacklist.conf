# Kiezel: kernel modules that a home desktop never needs, but that have a history of remotely or
# locally exploitable bugs (docs/hardening.md §4b). "install ... /bin/false" also blocks
# automatic loading. Suggested by the Lynis scan (NETW-3200, STRG-1846).
#
# Rare network protocols (WebRTC uses SCTP in user space, not this kernel module):
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
# FireWire: gives a plugged-in device direct memory access (DMA attacks on old PCs).
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
