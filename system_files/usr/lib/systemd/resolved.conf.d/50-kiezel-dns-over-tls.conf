# Kiezel DNS (ADR-0012, docs/hardening.md §3):
#  - Quad9 is the primary resolver, encrypted with DNS-over-TLS whenever possible (opportunistic).
#  - The network's own DNS (the router) is still used for local names (routing domains from
#    DHCP, e.g. nas.home.arpa) and as an AUTOMATIC FALLBACK when Quad9 does not answer
#    (captive portals, networks that filter DNS). /usr/libexec/kiezel/dns-route decides per link.
#  - Privacy trade-off: DNS questions go to Quad9 (Switzerland) instead of the ISP/router.
#    Turn it off with: ujust kiezel-dns-router
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
