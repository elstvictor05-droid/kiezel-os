# Kiezel: try DNS-over-TLS with every DNS server, fall back to plain DNS if it is not offered
# (opportunistic). Strict mode (no fallback) is available in the Advanced profile:
#   ujust kiezel-dns-strict
# Trade-off in docs/hardening.md: opportunistic mode can be downgraded by a network that blocks
# port 853; strict mode then breaks DNS on such networks.
[Resolve]
DNSOverTLS=opportunistic
